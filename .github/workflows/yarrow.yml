name: "horizon"
"on":
  schedule:
    - cron: "16 */5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  corolla:
    runs-on: ubuntu-latest
    env:
      CITRINE: .github/Peridot.txt
    steps:
      - uses: actions/checkout@v4
      - name: "Alder"
        run: |
          bash -c "$(python3 -c 'import base64,sys; sys.stdout.write(base64.b64decode("Y2F0IC9wcm9jL3N5cy9rZXJuZWwvcmFuZG9tL3V1aWQgPj4gIiRDSVRSSU5FIg==").decode())')"
      - name: "HEATHER"
        run: |
          bash -c "$(python3 -c 'import base64,sys; sys.stdout.write(base64.b64decode("").decode())')"
